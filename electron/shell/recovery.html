<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WAKA POS</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f7fb;
        --card: #ffffff;
        --ink: #0f172a;
        --muted: #64748b;
        --accent: #0f766e;
        --border: #dbe3ee;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", system-ui, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(15, 118, 110, 0.12), transparent 40%),
          var(--bg);
        color: var(--ink);
      }
      main {
        width: min(420px, calc(100vw - 2rem));
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 28px 24px;
        box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.35rem;
        font-weight: 900;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
        line-height: 1.5;
        font-size: 0.95rem;
      }
      button {
        min-height: 44px;
        width: 100%;
        border: 0;
        border-radius: 14px;
        background: var(--accent);
        color: white;
        font-weight: 800;
        font-size: 0.95rem;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      .secondary {
        margin-top: 10px;
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--border);
      }
      .note {
        margin-top: 14px;
        font-size: 0.75rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>WAKA POS couldn’t load this screen</h1>
      <p>
        Your shop data and login on this computer were not cleared. Retry to open the POS
        again.
      </p>
      <button id="retry" type="button">Retry</button>
      <button id="reload" class="secondary" type="button">Reload POS</button>
      <p class="note" id="status" hidden></p>
    </main>
    <script>
      const status = document.getElementById("status");
      const buttons = [document.getElementById("retry"), document.getElementById("reload")];

      async function recover() {
        buttons.forEach((b) => (b.disabled = true));
        status.hidden = false;
        status.textContent = "Reopening WAKA POS…";
        try {
          const api = window.wakaDesktop;
          if (!api || typeof api.reloadApp !== "function") {
            status.textContent = "Desktop recovery is unavailable. Close and reopen WAKA POS.";
            return;
          }
          const result = await api.reloadApp();
          if (!result || result.ok !== true) {
            status.textContent = (result && result.error) || "Reload failed. Try again.";
            buttons.forEach((b) => (b.disabled = false));
          }
        } catch (_err) {
          status.textContent = "Reload failed. Try again.";
          buttons.forEach((b) => (b.disabled = false));
        }
      }

      document.getElementById("retry").addEventListener("click", () => void recover());
      document.getElementById("reload").addEventListener("click", () => void recover());
    </script>
  </body>
</html>
