# Linked Supabase project (production). Deploy edge functions with:
#   npm run supabase:deploy:admin
project_id = "ljaedextsenbkxzzgxcg"

[auth]
enabled = true
# DKASU is the canonical production host; the WAKA origins 308-redirect here and
# stay allowlisted. Additive only — nothing was removed, so any link already in
# flight against a legacy host keeps working.
#
# NOTE: this file configures LOCAL development (`supabase start`) and is not
# authoritative for the hosted project. The live Auth URL configuration lives in
# the Supabase dashboard and must be verified there — see docs/ANDROID.md and the
# Phase 8 report for the exact list. `wakapos://callback` in particular has no
# local meaning and MUST be registered in the dashboard for native Google sign-in.
site_url = "https://pos.dkasu.com"
additional_redirect_urls = [
  "https://pos.dkasu.com",
  "https://pos.dkasu.com/auth/callback",
  "https://pos.dkasu.com/auth/recovery",
  "https://pos.dkasu.com/reset-password",
  "https://dkasu.com/auth/callback",
  "https://dkasu.com/auth/recovery",
  "https://dkasu.com/reset-password",
  "https://loyalty.dkasu.com/auth/callback",
  "https://loyalty.dkasu.com/auth/recovery",
  "https://pos.waka.ug",
  "https://pos.waka.ug/auth/callback",
  "https://pos.waka.ug/auth/recovery",
  "https://pos.waka.ug/reset-password",
  "https://waka.ug/auth/callback",
  "https://waka.ug/auth/recovery",
  "https://waka.ug/reset-password",
  "http://localhost:5173",
  "http://localhost:5173/auth/callback",
  "http://localhost:5173/auth/recovery",
  "http://localhost:5173/reset-password",
  "https://localhost/auth/callback",
  "https://localhost/auth/recovery",
  "https://localhost/reset-password",
]
jwt_expiry = 3600

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

[functions.admin-set-owner-password]
verify_jwt = true

[functions.admin-permanently-delete-shop-account]
verify_jwt = true

[functions.admin-delete-marketing-agent]
verify_jwt = true

[functions.owner-permanently-delete-account]
verify_jwt = true

[functions.auth-send-email]
verify_jwt = false

[functions.ai-ask-waka]
verify_jwt = true

[functions.staff-invite]
verify_jwt = true

[functions.efris-submit]
verify_jwt = true

[functions.loyalty-public-card]
verify_jwt = false

[functions.loyalty-public-wallet-issue]
verify_jwt = false

[functions.loyalty-public-enroll]
verify_jwt = false

# Branded auth emails via Resend (auth-send-email edge function).
[auth.hook.send_email]
enabled = true
uri = "https://ljaedextsenbkxzzgxcg.supabase.co/functions/v1/auth-send-email"
secrets = "env(SEND_EMAIL_HOOK_SECRET)"

# M3-C payment foundation — provider-agnostic initiation + status recovery.
# Both run authenticated (the caller's JWT authorizes the payment through the
# M3-B read RPC); no provider callback endpoints exist yet (M3-E/F/G).
[functions.payment-initiate]
verify_jwt = true

[functions.payment-status]
verify_jwt = true

# M3-E provider callbacks — anonymous at the HTTP layer because providers send
# no Supabase JWT; authority is provider signature verification over the raw
# body inside the shared callback core (fail-closed: the adapter registry is
# empty until M3-F/M3-G, so these endpoints currently return
# provider_not_configured / 503 without touching the ledger).
[functions.payment-callback-mtnmomo]
verify_jwt = false

[functions.payment-callback-airtelmoney]
verify_jwt = false
