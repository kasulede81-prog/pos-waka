<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.webp" />
    <link rel="apple-touch-icon" href="/icons/icon-192.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fffaf5" />
    <script src="/boot-recovery.js"></script>
    <style>
      html,
      body {
        margin: 0;
        background: #fffaf5;
      }
      /**
       * PRE-BOOT DARK BACKGROUND. `#fffaf5` is the light cream; without this the <html> element
       * kept it in dark mode (body was overridden by index.css, html never was), which showed as
       * a cream band around the app and a cream flash on overscroll / route transitions.
       * The value mirrors `--background` in the dark token block of src/index.css (24 10% 6%).
       * It only applies once the boot script below puts `.dark` / `.marketing-theme-dark` on <html>.
       */
      html.dark,
      html.dark body,
      html.marketing-theme-dark,
      html.marketing-theme-dark body {
        background: hsl(24 10% 6%);
      }
      /** The pre-React splash is inline-styled, so it needs !important to follow the theme. */
      html.dark #waka-html-boot,
      html.marketing-theme-dark #waka-html-boot {
        background: hsl(24 10% 6%) !important;
        color: #f5f2ef !important;
      }
    </style>
    <meta name="color-scheme" content="light dark" />
    <script>
      /**
       * PRE-BOOT THEME. Runs before the bundle so the splash and the document background are
       * already correct — no light flash for a dark-mode user.
       *
       * Mirrors `bootstrapAppThemeClass()` in src/lib/appTheme.ts: same keys (current first, the
       * legacy marketing key as a fallback), same classes (BOTH `.dark` and
       * `.marketing-theme-dark`, which is what the dark CSS is written against), same
       * theme-color values. It used to run on marketing paths only and read the legacy key only,
       * so app routes booted light; the app re-applies the identical state once it mounts.
       */
      (function () {
        try {
          var keys = ["waka-app-theme", "waka-marketing-theme"];
          var pref = null;
          for (var i = 0; i < keys.length && !pref; i++) {
            var raw = localStorage.getItem(keys[i]);
            if (raw === "light" || raw === "dark" || raw === "system") pref = raw;
          }
          var dark =
            pref === "dark" ||
            (pref !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.classList.toggle("dark", dark);
          root.classList.toggle("marketing-theme-dark", dark);
          root.style.colorScheme = dark ? "dark" : "light";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#0B0F19" : "#fffaf5");
        } catch (e) {
          /* storage unavailable — the app's own bootstrap still applies the theme */
        }
      })();
    </script>
    <meta name="application-name" content="DKASU POS" />
    <title>DKASU POS – Business Management &amp; POS Software for Uganda</title>
    <meta
      name="description"
      content="DKASU POS helps shops, supermarkets, pharmacies, boutiques and growing businesses manage sales, inventory, customers and staff in one powerful platform."
    />
    <meta
      name="keywords"
      content="Uganda POS, DKASU POS, DKASU, shop POS Uganda, pharmacy POS, salon POS, restaurant POS, offline POS Uganda"
    />
    <link rel="canonical" href="https://dkasu.com/home" />
    <meta property="og:title" content="DKASU POS – Business Management &amp; POS Software for Uganda" />
    <meta
      property="og:description"
      content="DKASU POS helps shops, supermarkets, pharmacies, boutiques and growing businesses manage sales, inventory, customers and staff in one powerful platform."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dkasu.com/home" />
    <meta property="og:site_name" content="DKASU" />
    <meta property="og:image" content="https://dkasu.com/og-dkasu.png" />
    <meta property="og:locale" content="en_UG" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DKASU POS – Business Management &amp; POS Software for Uganda" />
    <meta
      name="twitter:description"
      content="POS Software Uganda with inventory management, retail POS, pharmacy POS, supermarket POS, and restaurant POS for Ugandan businesses."
    />
    <meta name="twitter:image" content="https://dkasu.com/og-dkasu.png" />
  </head>
  <body>
    <div id="root">
      <div
        id="waka-html-boot"
        style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#fffaf5;color:#9a3412;font-family:system-ui,sans-serif"
      >
        <strong style="font-size:1.125rem">DKASU POS</strong>
        <span style="font-size:0.875rem;font-weight:600">Loading…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
